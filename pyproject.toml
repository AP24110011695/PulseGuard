[project]
name = "pulseguard"
version = "0.1.0"
description = "Real-Time Metric Anomaly Detection & Probabilistic Forecasting Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.4",
    "mlflow>=2.14",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in argument defaults is the standard FastAPI idiom.
"backend/app/api/*" = ["B008"]
"backend/alembic/versions/*" = ["E501"]
